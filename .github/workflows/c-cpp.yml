name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update

          # Unlink bazelisk if present (to avoid conflicts)
          brew unlink bazelisk || true

          # Install core libraries + Bazelisk (pulls in Bazel 7.4.1 via .bazelversion)
          # We do NOT install system‐wide flatbuffers here (we'll use the Bazel‐provided one).
          brew install pkg-config opencv libimobiledevice libplist cmake make bazelisk

      - name: Build & “private‐install” FlatBuffers v24.3.25
        run: |
          # Clone FlatBuffers, check out exactly v24.3.25, install into a private prefix
          git clone https://github.com/google/flatbuffers.git flatbuffers_src
          cd flatbuffers_src
          git checkout v24.3.25

          # Create a “flatbuffers_install” folder under our workspace
          INSTALL_DIR="${{ github.workspace }}/flatbuffers_install"
          mkdir -p build && cd build

          # Configure so that `make install` writes into INSTALL_DIR
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
                ..
          cmake --build . --target install

          # After this, you should see:
          #   • ${INSTALL_DIR}/include/flatbuffers/flatbuffers.h
          #   • ${INSTALL_DIR}/lib/libflatbuffers.a

      - name: Add Bazelisk to PATH
        run: |
          echo "$(brew --prefix bazelisk)/bin" >> $GITHUB_PATH

      - name: Clone TensorFlow
        run: |
          git clone https://github.com/tensorflow/tensorflow.git src/tensorflow

      - name: Build TensorFlow Lite via Bazelisk
        working-directory: src/tensorflow
        run: |
          # Use defaults for configure; we only care about the C++ TFLite target
          yes "" | ./configure

          # bazelisk will fetch Bazel 7.4.1 per .bazelversion automatically
          bazelisk build -c opt //tensorflow/lite:libtensorflowlite.dylib

      - name: Configure with CMake
        run: |
          mkdir -p build
          cd build

          # Grab the FlatBuffers include path from our private install:
          FLAT_DIR="${{ github.workspace }}/flatbuffers_install/include"

          # Now invoke CMake.  We explicitly pass:
          #   ‣ TFLITE_INCLUDE_DIR   → TensorFlow source root (so interpreter.h is found)
          #   ‣ TFLITE_LIB           → Bazel‐built libtensorflowlite.dylib
          #   ‣ FLATBUFFERS_INCLUDE_DIR → our private FlatBuffers install
          # We do NOT pass IMOBILEDEVICE_* or PLIST_* here; CMakeLists will find them on its own.
          cmake \
            -DTFLITE_INCLUDE_DIR="${{ github.workspace }}/src/tensorflow" \
            -DTFLITE_LIB="${{ github.workspace }}/src/tensorflow/bazel-bin/tensorflow/lite/libtensorflowlite.dylib" \
            -DFLATBUFFERS_INCLUDE_DIR="${FLAT_DIR}" \
            ..

      - name: Build
        run: |
          cd build
          cmake --build .

      # (Optional) Add tests/dist targets if you have them:
      # - name: Test
      #   run: |
      #     cd build
      #     cmake --build . --target check
      #
      # - name: Dist Check
      #   run: |
      #     cd build
      #     cmake --build . --target distcheck
