name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update

          # Unlink bazelisk if present, to avoid conflicts with bazel
          brew unlink bazelisk || true

          # Core libraries
          brew install pkg-config opencv libimobiledevice libplist flatbuffers cmake make bazel

      - name: Clone TensorFlow
        run: |
          git clone https://github.com/tensorflow/tensorflow.git src/tensorflow

      - name: Build TensorFlow Lite via Bazel
        working-directory: src/tensorflow
        run: |
          # Configure TensorFlow (defaults are fine for TFLite C++ build)
          yes "" | ./configure
          # Build the TFLite C++ library
          bazel build -c opt //tensorflow/lite:libtensorflowlite.dylib

      - name: Configure with CMake
        run: |
          mkdir -p build
          cd build
          cmake \
            -DTFLITE_INCLUDE_DIR=${{ github.workspace }}/src/tensorflow \
            -DTFLITE_LIB=${{ github.workspace }}/src/tensorflow/bazel-bin/tensorflow/lite/libtensorflowlite.dylib \
            -DCMAKE_BUILD_TYPE=Release \
            ..

      - name: Build
        run: |
          cd build
          cmake --build .

      # - name: Test
