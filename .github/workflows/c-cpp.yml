name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update

          # Unlink bazelisk if present
          brew unlink bazelisk || true

          # Install core libraries and Bazelisk (picks up Bazel 7.4.1 per .bazelversion)
          # We do NOT install system flatbuffers here (we’ll use the Bazel one).
          brew install pkg-config opencv libimobiledevice libplist cmake make bazelisk

      - name: Add Bazelisk to PATH
        run: |
          echo "$(brew --prefix bazelisk)/bin" >> $GITHUB_PATH

      - name: Clone TensorFlow
        run: |
          git clone https://github.com/tensorflow/tensorflow.git src/tensorflow

      - name: Build TensorFlow Lite via Bazelisk
        working-directory: src/tensorflow
        run: |
          # Configure TensorFlow with defaults (we only need the C++ TFLite build)
          yes "" | ./configure
          # Use bazelisk so it downloads Bazel 7.4.1 per .bazelversion
          bazelisk build -c opt //tensorflow/lite:libtensorflowlite.dylib

      - name: Configure with CMake
        run: |
          mkdir -p build
          cd build

          # Determine the Bazel FlatBuffers path
          # (this is where Bazel has pulled in the FlatBuffers headers)
          FLAT_DIR="${{ github.workspace }}/src/tensorflow/bazel-bin/external/flatbuffers/include"

          # Determine Homebrew prefix (for libimobiledevice/libplist)
          BREW_PREFIX=$(brew --prefix)

          cmake \
            -DTFLITE_INCLUDE_DIR=${{ github.workspace }}/src/tensorflow \
            -DTFLITE_LIB=${{ github.workspace }}/src/tensorflow/bazel-bin/tensorflow/lite/libtensorflowlite.dylib \
            -DFLATBUFFERS_INCLUDE_DIR=${FLAT_DIR} \
            -DIMOBILEDEVICE_INCLUDE_DIR=${BREW_PREFIX}/include \
            -DIMOBILEDEVICE_LIB=${BREW_PREFIX}/lib/libimobiledevice.dylib \
            -DPLIST_LIB=${BREW_PREFIX}/lib/libplist.dylib \
            -DCMAKE_BUILD_TYPE=Release \
            ..

      - name: Build
        run: |
          cd build
          cmake --build .

      # - name: Test
