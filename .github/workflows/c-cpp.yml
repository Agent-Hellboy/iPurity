name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update

          # Unlink bazelisk if present, to avoid conflicts
          brew unlink bazelisk || true

          # Install core libraries and Bazelisk (will pick up Bazel 7.4.1 per .bazelversion)
          # Note: we no longer install FlatBuffers via Homebrew, since TensorFlow Lite
          # expects the version bundled under src/tensorflow/third_party/flatbuffers.
          brew install pkg-config opencv libimobiledevice libplist cmake make bazelisk

      - name: Add Bazelisk to PATH
        run: |
          echo "$(brew --prefix bazelisk)/bin" >> $GITHUB_PATH

      - name: Clone TensorFlow
        run: |
          git clone https://github.com/tensorflow/tensorflow.git src/tensorflow

      - name: Build TensorFlow Lite via Bazelisk
        working-directory: src/tensorflow
        run: |
          # Configure TensorFlow (defaults are fine for TFLite C++ build)
          yes "" | ./configure
          # Use bazelisk (automatically downloads Bazel 7.4.1 per .bazelversion)
          bazelisk build -c opt //tensorflow/lite:libtensorflowlite.dylib

      - name: Configure with CMake
        run: |
          mkdir -p build
          cd build
          # Determine Homebrew prefix (handles Intel vs. Apple Silicon)
          BREW_PREFIX=$(brew --prefix)
          cmake \
            -DTFLITE_INCLUDE_DIR=${{ github.workspace }}/src/tensorflow \
            -DTFLITE_LIB=${{ github.workspace }}/src/tensorflow/bazel-bin/tensorflow/lite/libtensorflowlite.dylib \
            -DFLATBUFFERS_INCLUDE_DIR=${{ github.workspace }}/src/tensorflow/third_party/flatbuffers/include \
            -DIMOBILEDEVICE_INCLUDE_DIR=${BREW_PREFIX}/include \
            -DIMOBILEDEVICE_LIB=${BREW_PREFIX}/lib/libimobiledevice.dylib \
            -DPLIST_LIB=${BREW_PREFIX}/lib/libplist.dylib \
            -DCMAKE_BUILD_TYPE=Release \
            ..

      - name: Build
        run: |
          cd build
          cmake --build .

