name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update

          # Unlink bazelisk if present
          brew unlink bazelisk || true

          # Install core libraries and Bazelisk (picks up Bazel 7.4.1 per .bazelversion)
          brew install pkg-config opencv libimobiledevice libplist cmake make bazelisk

      - name: Build & “private‐install” FlatBuffers v24.3.25
        run: |
          # Clone FlatBuffers and check out v24.3.25
          git clone https://github.com/google/flatbuffers.git flatbuffers_src
          cd flatbuffers_src
          git checkout v24.3.25

          # Create a private install prefix under $GITHUB_WORKSPACE
          INSTALL_DIR="${{ github.workspace }}/flatbuffers_install"
          mkdir -p build && cd build

          # Configure so that “make install” writes into our private INSTALL_DIR
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
                ..
          cmake --build . --target install

          # At this point, FlatBuffers headers live in:
          #    $GITHUB_WORKSPACE/flatbuffers_install/include/flatbuffers/flatbuffers.h
          # and the static library (libflatbuffers.a) lives in:
          #    $GITHUB_WORKSPACE/flatbuffers_install/lib/libflatbuffers.a

      - name: Add Bazelisk to PATH
        run: |
          echo "$(brew --prefix bazelisk)/bin" >> $GITHUB_PATH

      - name: Clone TensorFlow
        run: |
          git clone https://github.com/tensorflow/tensorflow.git src/tensorflow

      - name: Build TensorFlow Lite via Bazelisk
        working-directory: src/tensorflow
        run: |
          # Use defaults for configure (we only need the C++ TFLite build)
          yes "" | ./configure
          # bazelisk will download Bazel 7.4.1 per the .bazelversion
          bazelisk build -c opt //tensorflow/lite:libtensorflowlite.dylib

      - name: Configure with CMake
        run: |
          mkdir -p build
          cd build

          # “private” FlatBuffers include directory:
          FB_INCLUDE="${{ github.workspace }}/flatbuffers_install/include"
          # Homebrew prefix for libimobiledevice / libplist
          BREW_PREFIX=$(brew --prefix)

          cmake \
            -DTFLITE_INCLUDE_DIR=${{ github.workspace }}/src/tensorflow \
            -DTFLITE_LIB=${{ github.workspace }}/src/tensorflow/bazel-bin/tensorflow/lite/libtensorflowlite.dylib \
            -DFLATBUFFERS_INCLUDE_DIR="${FB_INCLUDE}" \
            -DIMOBILEDEVICE_INCLUDE_DIR="${BREW_PREFIX}/include" \
            -DIMOBILEDEVICE_LIB="${BREW_PREFIX}/lib/libimobiledevice.dylib" \
            -DPLIST_LIB="${BREW_PREFIX}/lib/libplist.dylib" \
            -DCMAKE_BUILD_TYPE=Release \
            ..

      - name: Build
        run: |
          cd build
          cmake --build .

      # - name: Test
      #   run: |
      #     cd build
      #     cmake --build . --target check

      # - name: Dist Check
      #   run: |
      #     cd build
      #     cmake --build . --target distcheck
